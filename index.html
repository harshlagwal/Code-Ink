<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ═══════════════════════════════════════════════════════════════
         SECURITY HEADERS (client-side meta equivalents)
         For production: mirror these as HTTP response headers (Netlify _headers
         or Vercel vercel.json) for full enforcement — meta tags cover most
         browsers but HTTP headers are the authoritative source.
         ═══════════════════════════════════════════════════════════════ -->

    <!-- Content Security Policy
         • default-src 'self'                 – load only from same origin
         • script-src 'unsafe-inline/eval'    – required by Vite + React HMR
         • connect-src                        – whitelist only known API hosts
         • frame-ancestors 'none'             – blocks clickjacking / iframe embed
         • object-src 'none'                  – disables Flash & legacy plugins
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://generativelanguage.googleapis.com https://openrouter.ai https://wandbox.org https://fonts.googleapis.com https://fonts.gstatic.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self';"
    />

    <!-- Prevent Referer header leaking API keys in URL query strings -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link rel="icon" type="image/webp" href="/codeink-logo.webp" />
    <link rel="apple-touch-icon" href="/codeink-logo.webp" />
    <link rel="canonical" href="https://code-ink-theta.vercel.app/" />

    <!-- Primary Meta Tags -->
    <title>CODEINK - Your Programming Notebook | Interactive CS Learning & 100 Free Tools</title>

    <meta name="author" content="Harsh Lagwal" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#1E232A" />

    <!-- Google Search Console Verification Meta Tag -->

    <meta property="og:url" content="https://code-ink-theta.vercel.app/" />
